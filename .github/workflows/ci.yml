name: Submit to Anvil

on:
  push:

permissions:
  contents: read

jobs:
  submit:
    if: github.repository_owner == 'offGridSoft' || github.repository == 'deliri/primitive'
    # GitHub hosts this notification; Anvil runs the project on Fedora.
    runs-on: ubuntu-latest
    timeout-minutes: 310
    steps:
      - name: Join the Anvil tailnet
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd
        with:
          authkey: ${{ secrets.ANVIL_TAILSCALE_AUTHKEY }}
          ping: 100.84.35.44

      - name: Send the exact pushed revision to Anvil
        env:
          ANVIL_ENDPOINT: http://100.84.35.44:8089
          ANVIL_TOKEN: ${{ secrets.ANVIL_GITHUB_TOKEN }}
          ANVIL_PROJECT_ID: ${{ vars.ANVIL_PROJECT_ID }}
        run: |
          set -euo pipefail
          test -n "$ANVIL_TOKEN"
          test -n "$ANVIL_PROJECT_ID"
          node <<'JS' > "$RUNNER_TEMP/anvil-request.json"
          const crypto = require('node:crypto');
          const id = crypto.randomBytes(16);
          id.writeUIntBE(Date.now(), 0, 6);
          id[6] = (id[6] & 15) | 112;
          id[8] = (id[8] & 63) | 128;
          const hex = id.toString('hex');
          const nonce = `${hex.slice(0,8)}-${hex.slice(8,12)}-${hex.slice(12,16)}-${hex.slice(16,20)}-${hex.slice(20)}`;
          console.log(JSON.stringify({schema_version:1, repository:process.env.GITHUB_REPOSITORY,
            commit:process.env.GITHUB_SHA, project:process.env.ANVIL_PROJECT_ID, request_nonce:nonce}));
          JS
          nonce=$(jq -er '.request_nonce' "$RUNNER_TEMP/anvil-request.json")
          echo "Admission nonce: $nonce; commit: $GITHUB_SHA"
          deadline=$((SECONDS + 18000))
          backoff=15
          attempt=0
          while (( SECONDS < deadline )); do
            attempt=$((attempt + 1))
            remaining=$((deadline - SECONDS))
            request_timeout=$((remaining < 400 ? remaining : 400))
            receipt="$RUNNER_TEMP/anvil-admission-$attempt.json"
            echo "Admission attempt $attempt"
            if curl --fail-with-body --silent --show-error --connect-timeout 15 --max-time "$request_timeout" \
              -H "Authorization: Bearer $ANVIL_TOKEN" \
              -H 'Content-Type: application/json' \
              -H "Idempotency-Key: anvil-project-request:$nonce" \
              --data-binary "@$RUNNER_TEMP/anvil-request.json" \
              "$ANVIL_ENDPOINT/v1/private/anvil/github/project-runs" > "$receipt"; then
              cat "$receipt"
              if jq -e '.admissions | length == 1 and all(.[]; .state == 2 or .state == 3)' "$receipt"; then
                echo 'Anvil acknowledged this revision. Test results are recorded through the API.' >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
              echo "::warning::Admission attempt $attempt is not yet acknowledged."
            else
              status=$?
              cat "$receipt"
              echo "::warning::Admission attempt $attempt ended with curl status $status; completion is unconfirmed."
            fi
            remaining=$((deadline - SECONDS))
            if (( remaining <= 0 )); then break; fi
            wait_seconds=$((backoff < remaining ? backoff : remaining))
            echo "Waiting $wait_seconds seconds before retrying the identical request and idempotency key."
            sleep "$wait_seconds"
            backoff=$((backoff < 120 ? backoff * 2 : 120))
          done
          echo '::error::Anvil did not acknowledge admission within five hours.'
          exit 1

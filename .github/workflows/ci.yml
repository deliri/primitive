name: Native Foundation gates

on:
  # Automatic runs are intentionally disabled to avoid noisy failure mail.
  # Invoke this workflow explicitly when remote native-runner proof is needed.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Native gates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run canonical gate
        shell: bash
        run: bash scripts/gate.sh ".artifacts/gates/${{ runner.os }}-${{ runner.arch }}"

      - name: Upload durable gate artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: foundation-gates-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/gates/
          if-no-files-found: error
          retention-days: 30
